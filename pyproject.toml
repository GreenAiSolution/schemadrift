[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "schemadrift"
version = "0.1.0"
description = "Infer JSON schemas from real payloads and classify who a change breaks."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "GreenAI Solutions" }]
keywords = ["json", "schema", "api", "contract-testing", "breaking-changes"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/GreenAiSolution/schemadrift"
Issues = "https://github.com/GreenAiSolution/schemadrift/issues"

[project.scripts]
schemadrift = "schemadrift.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
